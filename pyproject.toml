[project]
name = "vidrev"
version = "2.1.0"
description = "Universal Video-to-Prompt Pipeline — deconstruct any video into production-ready prompts for 8+ AI video models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    { name = "Venkata-Manoj" },
]
keywords = ["video", "prompt", "ai", "video-generation", "runway", "sora", "kling", "gemini", "veo", "luma", "pika", "haiper", "stable-video-diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "mypy>=1.8.0",
]
web = [
    "flask>=3.0.0",
]
whisper = [
    "openai-whisper>=20231117",
]

[project.urls]
Homepage = "https://github.com/Venkata-Manoj/videoreverse"
Repository = "https://github.com/Venkata-Manoj/videoreverse"
Issues = "https://github.com/Venkata-Manoj/videoreverse/issues"

[project.scripts]
vidrev = "src.main:main"
vidrev-web = "web.app:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "utils*", "tests*", "scripts*", "web*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "__pycache__",
    "output_blueprints",
    ".cache",
    "test_results",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length (handled by formatter)
    "F401",  # unused imports (handled manually)
    "UP007", # X | Y style unions (keep for older Python compat)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "utils", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "tests/",
    ".cache/",
    "output_blueprints/",
    "test_results/",
]
