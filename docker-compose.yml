services:
  vidrev:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidrev:latest
    container_name: vidrev
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VIDEO_REV_OUTPUT_DIR=/data/output
      - VIDEO_REV_LOG_LEVEL=info
    volumes:
      - ./videos:/data/videos:ro
      - ./output_blueprints:/data/output
      - .cache:/app/.cache
    command: ["src.main", "--help"]
    restart: unless-stopped
    network_mode: bridge

  vidrev-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: vidrev:latest
    container_name: vidrev-web
    ports:
      - "7860:7860"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VIDEO_REV_OUTPUT_DIR=/data/output
      - VIDEO_REV_WEB_HOST=0.0.0.0
    volumes:
      - .cache:/app/.cache
      - ./output_blueprints:/data/output
    command: ["web"]
    restart: unless-stopped
